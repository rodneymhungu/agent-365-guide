name: Weekly feedback digest → issue

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'   # Mondays, half an hour after the Learn drift run

permissions:
  contents: read
  issues: write             # the digest is delivered as an issue, which GitHub emails to watchers
  pull-requests: read       # the collector lists open learn-drift pull requests and their age
  copilot-requests: write   # lets GITHUB_TOKEN call Copilot CLI if COPILOT_PAT is not set

env:
  OWNER: rodneymhungu       # assigned and mentioned on every digest so it lands in notifications and email

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect signals (GoatCounter, GitHub, Brave)
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/feedback_collect.py

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Write the digest
        env:
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$COPILOT_PAT" ]; then export COPILOT_GITHUB_TOKEN="$COPILOT_PAT"; fi
          cat > /tmp/prompt.md << 'PROMPT'
          Read feedback-input.md (weekly signals about a public guide), PLAN.md (the growth
          plan: target, weekly rotation, log) and index.html (the guide). Write digest.md as a
          short email body in plain Markdown, British spelling, no em or en dashes, no headers
          larger than ###, under 350 words:

          0. If feedback-input.md has an "Action needed" section, repeat it first, verbatim,
             under the heading "### Action needed". Otherwise omit this part.
          1. Three lines of numbers: visitors this week against the target in PLAN.md,
             where they came from (referrers, not paths), which sections and pages were
             opened most, anything that moved sharply. If a source was unavailable, say so
             in one clause.
          2. "Waiting on you": list every open learn-drift pull request from the inputs
             with its age in days. If there are none, one sentence.
          3. "What people are saying": summarise each public mention or issue in one line
             with its link. If there are none, say so in one sentence and move on.
          4. "This week's focus": the rotation focus named in the inputs, and the single
             most useful concrete step towards it given the evidence (a referrer, a
             high-traffic section, an issue, a mention). Cite the guide section id
             (e.g. s7-4) where it applies. No generic advice.
          5. One closing line: what to watch next week.

          Do not invent numbers. Do not modify any file other than digest.md.
          PROMPT
          # claude-haiku-4.5 is listed as a valid --model id in the Copilot CLI programmatic
          # reference; swap it if `copilot help` on the runner shows a different cheap model.
          copilot -p "$(cat /tmp/prompt.md)" \
            --allow-tool=write \
            --allow-tool='shell(cat:*)' \
            --model claude-haiku-4.5 \
            --no-ask-user -s
          test -f digest.md || cp feedback-input.md digest.md

      - name: Open the digest as an issue, close the previous one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@${OWNER} this week's digest. The plan of record is [PLAN.md](PLAN.md)."
            echo
            cat digest.md
            echo
            echo "<details>"
            echo "<summary>Raw signals collected this week</summary>"
            echo
            echo '```'
            cat feedback-input.md
            echo '```'
            echo
            echo "</details>"
          } > issue-body.md
          gh label create digest --color 0e8a16 --description "Weekly feedback digest" --force
          previous=$(gh issue list --label digest --state open --json number --jq '.[].number')
          new=$(gh issue create --title "Weekly digest, $(date -u '+%-d %B %Y')" \
                  --body-file issue-body.md --label digest --assignee "$OWNER")
          echo "Opened $new"
          for n in $previous; do
            gh issue close "$n" --comment "Superseded by $new."
          done
