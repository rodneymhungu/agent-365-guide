name: Learn drift → pull request

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC (07:00 Amsterdam in summer)

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write   # lets GITHUB_TOKEN call Copilot CLI if COPILOT_PAT is not set

concurrency:
  group: learn-drift
  cancel-in-progress: false

env:
  OWNER: rodneymhungu       # assigned, requested as reviewer and mentioned on every drift PR

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect drift on cited Learn pages (no LLM)
        id: watch
        run: |
          python3 scripts/learn_watch.py | tee -a "$GITHUB_OUTPUT"
          echo "### Learn drift" >> "$GITHUB_STEP_SUMMARY"
          head -n 3 learn-diff.md >> "$GITHUB_STEP_SUMMARY"

      # ---------- Everything below only runs when a cited page changed ----------

      - name: Set up Node.js
        if: steps.watch.outputs.changed == 'true'
        uses: actions/setup-node@v7

      - name: Install Copilot CLI
        if: steps.watch.outputs.changed == 'true'
        run: npm install -g @github/copilot

      # Microsoft Learn MCP server so Copilot can read the full page, not just the diff.
      # Path and shape per docs.github.com "Add MCP servers for Copilot CLI" (5 Sep 2026).
      - name: Configure Microsoft Learn MCP
        if: steps.watch.outputs.changed == 'true'
        run: |
          mkdir -p ~/.copilot
          cat > ~/.copilot/mcp-config.json << 'JSON'
          {
            "mcpServers": {
              "microsoft-learn": { "type": "http", "url": "https://learn.microsoft.com/api/mcp", "tools": ["*"] }
            }
          }
          JSON

      - name: Propose guide edits with Copilot CLI
        if: steps.watch.outputs.changed == 'true'
        env:
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}      # fine-grained PAT, "Copilot Requests" permission
          GITHUB_TOKEN: ${{ github.token }}            # fallback auth (org-billed Copilot only)
        run: |
          if [ -n "$COPILOT_PAT" ]; then export COPILOT_GITHUB_TOKEN="$COPILOT_PAT"; fi
          cat > /tmp/prompt.md << 'PROMPT'
          You are maintaining a guide to Microsoft Agent 365 for security and compliance
          engineers. It is two HTML pages plus one data file:
            - index.html: the full guide, chapters 1 to 10.
            - licensing.html: chapter 2 published on its own page. Its <section id="s2"> block
              is a byte-for-byte copy of the one in index.html, apart from elements marked
              data-page-only. Any edit inside chapter 2 must be made identically in both files.
            - a365-data.js: the window.A365 object: review date, dates, prices, the changelog
              and the status tier of every capability. Both pages render from it.
          Read learn-diff.md first. It lists Microsoft Learn pages that changed since the last
          run, a unified diff of each, and which guide sections (ids like s6-2, with the page
          names in brackets) cite that page. Entries ending in toc.json are docs tables of
          contents: a new line there means Microsoft published a new page, which may describe
          a capability the guide does not cover yet.

          Your job, in order:
          1. For each changed page, decide whether the change affects a factual claim in the cited
             sections. Cosmetic Learn edits (wording, navigation, dates in the header) do not.
          2. Where a claim is affected, make the minimal edit to the relevant section's prose.
             Keep the author's voice, British spelling, and the existing sentence rhythm. Do not
             add new sections, do not restructure, do not touch "Rodney's field note" callouts.
          3. If a capability's status moved (preview → GA, new Frontier preview, retired), update
             the matching entry in the capabilities array in a365-data.js. A page dropping
             "(Preview)" from its title or losing its prerelease notice is NOT a GA signal on its
             own: Learn pages are relabelled ahead of, and inconsistently with, the product. Move a
             tier to ga only when the product's own release notes or What's new page carry a GA
             entry for that capability (for Defender for Endpoint: whats-new-in-microsoft-defender-endpoint;
             for Defender XDR: its release notes). Otherwise leave the tier, add a note saying the
             label moved, and list it under "Needs a human decision". Use the existing tier
             keys: ga, preview, frontier, roadmap. Update the note field if a date or licence
             dependency changed. Then set reviewed to today's date in the form "5 September 2026"
             and add one entry to the changes array (newest first) with the section id and a
             one-line description that names the Learn page.
          4. If you cannot verify a change against the Learn page itself (use the microsoft-learn
             MCP server to fetch it), do not guess: leave the prose alone and describe the
             uncertainty in CHANGES.md instead.
          5. Write CHANGES.md: one bullet per edit with the section id, the Learn URL, and a
             one-line reason. Add a final "Needs a human decision" list for anything you skipped,
             including any new Learn page that the guide should probably cite.

          Never edit files other than index.html, licensing.html, a365-data.js and CHANGES.md.
          Never touch guide.css or guide.js.
          PROMPT
          copilot -p "$(cat /tmp/prompt.md)" \
            --allow-tool=write \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='microsoft-learn' \
            --no-ask-user -s
          test -f CHANGES.md || echo "- Copilot produced no CHANGES.md; review learn-diff.md manually." > CHANGES.md

      # Status tiers change only by a human. Put back any tier the model moved and list the
      # proposal under "Needs a human decision" (scripts/guard_tiers.py explains why).
      - name: Guard status tiers
        if: steps.watch.outputs.changed == 'true'
        run: python3 scripts/guard_tiers.py --restore --base HEAD

      # A chapter published on its own page must still match the guide. Report, do not block:
      # the PR is the review gate and the pages-check workflow marks it red.
      - name: Check split pages still match the guide
        if: steps.watch.outputs.changed == 'true'
        run: |
          python3 scripts/check_pages.py || {
            echo >> CHANGES.md
            echo "## Needs a human decision" >> CHANGES.md
            echo "- scripts/check_pages.py: chapter 2 differs between index.html and licensing.html. Make the two identical before merging." >> CHANGES.md
          }

      - name: Build PR body
        if: steps.watch.outputs.changed == 'true'
        run: |
          {
            echo "@${OWNER} a cited Learn page moved. Review, merge, then log it under focus 3 in [PLAN.md](../blob/main/PLAN.md)."
            echo
            echo "Automated weekly check of the Microsoft Learn pages this guide cites."
            echo
            echo "## Proposed edits"
            cat CHANGES.md
            echo
            echo "<details><summary>Raw Learn diff</summary>"
            echo
            cat learn-diff.md
            echo
            echo "</details>"
          } > /tmp/pr-body.md
          rm -f CHANGES.md learn-diff.md   # PR body carries these; keep the tree clean

      - name: Open or update pull request
        if: steps.watch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/learn-drift
          title: "Learn drift: cited pages changed"
          body-path: /tmp/pr-body.md
          commit-message: "chore: refresh Learn cache and propose guide edits"
          add-paths: |
            index.html
            licensing.html
            a365-data.js
            .learn-cache/**
          labels: learn-drift
          assignees: ${{ env.OWNER }}   # assignment and the mention above both notify and email
          reviewers: ${{ env.OWNER }}
          delete-branch: true

      # Nothing changed: still commit any newly cached pages (e.g. a URL added to index.html)
      # so next week has something to diff against. No-op when the cache is identical.
      - name: Refresh cache on main
        if: steps.watch.outputs.changed == 'false'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh Learn cache"
          file_pattern: ".learn-cache/**"
