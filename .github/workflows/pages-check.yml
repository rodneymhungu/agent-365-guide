name: Pages check

# Runs on every push and pull request. Fails when a chapter published on its
# own page no longer matches the guide, or when a shared script does not parse.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
      - name: A tier moving to GA cites release notes (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/guard_tiers.py --check --base "origin/${{ github.base_ref }}"
      - name: Split pages match the guide
        run: python3 scripts/check_pages.py
      - name: Shared scripts parse
        run: |
          node -e "new Function(require('fs').readFileSync('a365-data.js','utf8'))"
          node -e "new Function(require('fs').readFileSync('guide.js','utf8'))"
      - name: Every page is in the sitemap
        run: |
          for f in *.html; do
            grep -q "agent-365-guide/${f#index.html}<" sitemap.xml || { echo "$f missing from sitemap.xml"; exit 1; }
          done
